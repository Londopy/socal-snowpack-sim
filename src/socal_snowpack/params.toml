# Every threshold and rate in the snowpack model. All hand-set, none calibrated.
# Change a value here, rerun, and diff the results.

[levels]
considerable = 0.45          # index at or above this is "elevated"
high = 0.75

[solar]
solar_const_wm2 = 1353.0
meinel_base = 0.7            # Meinel clear-sky direct beam: S0 * base ** (airmass ** exp)
meinel_exp = 0.678
min_sin_el = 0.02            # sun counts as up above this
diffuse_frac = 0.1
diffuse_floor_wm2 = 15.0
substeps_per_hour = 6
peak_hours = 3               # "sunniest hours" used for the midday energy term

[weather]
